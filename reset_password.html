<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUIMS | Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="lucide.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        
         :root {
            --bg: #ffffff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --accent: #0f766e;
        }
        
        body.dark {
            --bg: #020617;
            --card: #020617;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background .3s, color .3s;
        }
        
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        .toggle-theme {
            position: absolute;
            top: 16px;
            right: 16px;
            cursor: pointer;
            z-index: 1000;
            padding: 8px;
            background: var(--card);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        
        .card {
            background: linear-gradient(135deg, #064e3b, #0f766e, #a16207);
            border-radius: 20px;
            padding: 2px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, .65);
        }
        
        .inner {
            background: var(--card);
            border-radius: 18px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: .3s;
        }
        
        .logo {
            width: 96px;
            height: 96px;
            margin: auto;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, #064e3b, #0f766e, #34d399, #0f766e);
            background-size: 300% 300%;
            animation: flow 6s infinite;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @keyframes flow {
            0% {
                background-position: 0% 50%
            }
            50% {
                background-position: 100% 50%
            }
            100% {
                background-position: 0% 50%
            }
        }
        
        h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }
        
        .sub {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        
        .msg {
            display: none;
            width: 100%;
            padding: 10px 12px;
            border: 2px solid;
            border-left-width: 4px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.45;
            text-align: left;
            overflow-wrap: anywhere;
        }
        
        .success {
            background: #fff;
            border-color: #059669;
            color: #047857;
        }
        
        .error {
            background: #fff;
            border-color: #dc2626;
            color: #be123c;
        }
        
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }
        
        .input-wrap {
            position: relative;
        }
        
        .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }
        
        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--muted);
        }
        
        input {
            width: 100%;
            transition: border .2s, box-shadow .2s;
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, .18);
        }
        
        button {
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #064e3b, #0f766e);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform .2s;
            margin-top: 14px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        a {
            text-align: center;
            font-size: 13px;
            color: #34d399;
            font-weight: 600;
            text-decoration: none;
        }
        
        @keyframes shake {
            0% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-5px);
            }
            40% {
                transform: translateX(5px);
            }
            60% {
                transform: translateX(-5px);
            }
            80% {
                transform: translateX(5px);
            }
            100% {
                transform: translateX(0);
            }
        }
        
        .shake {
            animation: shake .4s;
        }
        
        @media(max-width:480px) {
            .inner {
                padding: 24px 18px;
            }
            button {
                font-size: 13px;
                padding: 14px;
            }
        }
        
        .toggle-eye,
        .toggle-theme {
            padding: 10px;
            min-width: 40px;
            min-height: 40px;
        }
    </style>
</head>

<body class="dark">

    <canvas id="bgCanvas"></canvas>
    <div class="toggle-theme" onclick="toggleTheme()"><i data-lucide="sun"></i></div>

    <div class="wrapper" id="container">
        <div class="card">
            <div class="inner">
                <!-- Logo container -->
                <div class="logo">
                    <img src="system logo (2).webp" alt="QUIMS Logo">
                </div>

                <h2>Reset Password</h2>
                <p class="sub">Enter a strong new password to secure your account</p>

                <div id="msg" class="msg"></div>
                <div id="matchHint" class="msg" style="display:none"></div>

                <form id="resetForm">
                    <input type="hidden" id="token">

                    <div>
                        <label>New Password</label>
                        <div class="input-wrap">
                            <i data-lucide="lock" class="icon"></i>
                            <input type="password" id="password" required minlength="6">
                            <i data-lucide="eye" class="toggle-eye" onclick="togglePassword('password', this)"></i>
                        </div>
                    </div>

                    <div>
                        <label>Confirm Password</label>
                        <div class="input-wrap">
                            <i data-lucide="check" class="icon"></i>
                            <input type="password" id="confirm" required minlength="6" onpaste="return false" ondrop="return false" autocomplete="off">
                        </div>
                    </div>

                    <button type="submit" id="updateBtn">Update Password</button>
                </form>

                <a href="index.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const password = document.getElementById('password');
        const confirm = document.getElementById('confirm');
        const matchHint = document.getElementById('matchHint');
        const card = document.querySelector('.card');
        const updateBtn = document.getElementById('updateBtn');
        const token = document.getElementById('token');
        const container = document.getElementById('container');

        let userName = ''; // Will be fetched from DB

        token.value = new URLSearchParams(window.location.search).get('token') || '';

        // Fetch user info from server based on token
        async function fetchUserName() {
            if (!token.value) return;
            try {
                const res = await fetch(`get_user.php?token=${token.value}`);
                const data = await res.json();
                if (data.success && data.user) {
                    userName = data.user.full_name;
                }
            } catch (err) {
                console.error('Error fetching user info', err);
                userName = '';
            }
        }
        fetchUserName();

        function checkMatch() {
            if (!confirm.value) {
                matchHint.style.display = 'none';
                updateBtn.innerText = 'Update Password';
                return;
            }
            if (password.value === confirm.value) {
                matchHint.className = 'msg success';
                matchHint.innerText = 'Passwords match ✓';
                updateBtn.innerText = 'Update Password';
            } else {
                matchHint.className = 'msg error';
                matchHint.innerText = userName ? `Passwords do not match, ${userName}` : 'Passwords do not match';
                updateBtn.innerText = userName ? `Passwords do not match, ${userName}` : 'Passwords do not match';
            }
            matchHint.style.display = 'block';
        }

        password.addEventListener('input', checkMatch);
        confirm.addEventListener('input', checkMatch);

        function togglePassword(id, icon) {
            const input = document.getElementById(id);
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.setAttribute('data-lucide', show ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            container.style.background = getComputedStyle(document.body).getPropertyValue('--card');
        }

        /* Particle background */
        const c = document.getElementById('bgCanvas'),
            x = c.getContext('2d');
        let p = [];

        function initParticles() {
            c.width = innerWidth;
            c.height = innerHeight;
            p = [...Array(80)].map(() => ({
                x: Math.random() * c.width,
                y: Math.random() * c.height,
                vx: (Math.random() - .5) * .5,
                vy: (Math.random() - .5) * .5,
                r: Math.random() * 2 + 1
            }))
        }

        function animateParticles() {
            x.clearRect(0, 0, c.width, c.height);
            p.forEach(d => {
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 0 || d.x > c.width) d.vx *= -1;
                if (d.y < 0 || d.y > c.height) d.vy *= -1;
                x.beginPath();
                x.arc(d.x, d.y, d.r, 0, 7);
                const col = document.body.classList.contains('dark') ? '45,212,191' : '15,118,110';
                x.fillStyle = `rgba(${col},.3)`;
                x.fill();
                p.forEach(o => {
                    const dx = d.x - o.x,
                        dy = d.y - o.y,
                        m = Math.sqrt(dx * dx + dy * dy);
                    if (m < 140) {
                        x.beginPath();
                        x.moveTo(d.x, d.y);
                        x.lineTo(o.x, o.y);
                        x.strokeStyle = `rgba(${col},${(1-m/140)*.2})`;
                        x.stroke()
                    }
                })
            });
            requestAnimationFrame(animateParticles)
        }
        addEventListener('resize', initParticles);
        initParticles();
        animateParticles();

        /* Submit reset password */
        const f = document.getElementById('resetForm'),
            m = document.getElementById('msg');
        f.addEventListener('submit', async e => {
            e.preventDefault();
            if (password.value !== confirm.value) {
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                m.className = 'msg error';
                m.innerText = userName ? `Passwords do not match, ${userName}` : 'Passwords do not match';
                m.style.display = 'block';
                return;
            }
            try {
                const r = await fetch('reset_password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token.value,
                        password: password.value
                    })
                });
                const d = await r.json();
                if (!r.ok) {
                    throw new Error(d.message || 'Unable to reset your password.');
                }
                m.className = 'msg ' + (d.success ? 'success' : 'error');
                m.innerText = d.message || (d.success ? 'Password updated successfully' : 'Unable to reset your password.');
                m.style.display = 'block';
                if (d.success) setTimeout(() => location.href = 'index.html', 2500);
            } catch (err) {
                m.className = 'msg error';
                m.innerText = err.message || 'Server error';
                m.style.display = 'block';
            }
        });
    </script>
</body>

</html>
