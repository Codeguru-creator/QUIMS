<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (/\/assistant\/assistant-dashboard\.html$/i.test(window.location.pathname)) {
            window.location.replace('assistant-dashboard.php' + window.location.search + window.location.hash);
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Assistant Dashboard</title>
    <link rel="stylesheet" href="style.css?v=20261009-fixed-sidebar-ai-scroll" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="lucide.js"></script>
</head>

<body>
    <div id="toast-container" style="position:fixed;bottom:16px;right:16px;z-index:1200;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

    <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal()"></div>
    <div id="modal" class="modal hidden">
        <div class="modal-header">
            <h3 id="modal-title">Modal</h3>
            <button class="modal-close-btn" onclick="closeModal()"><i data-lucide="x" style="width:20px;height:20px"></i></button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer"></div>
    </div>

    <div id="notif-preview" class="notif-preview hidden"></div>

    <div class="app-layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-avatar" id="sidebar-avatar">
                    <img id="sidebar-logo-img" class="sidebar-logo-img hidden" src="" alt="Logo">
                    <span id="sidebar-avatar-text" class="sidebar-avatar-text">IT</span>
                </div>
                <p class="sidebar-subtitle" id="sidebar-subtitle">Assistant Portal</p>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <button id="sidebar-signout-btn" class="sidebar-signout-btn" onclick="openSignOutModal()">
                    <i data-lucide="log-out" class="icon-sm"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="closeSidebar()"></div>

        <main class="main-area">
            <header class="header">
                <div class="nav-left">
                    <button class="hamburger-btn" onclick="toggleSidebar()">
                        <i data-lucide="menu" class="icon-md"></i>
                    </button>
                    <div class="header-clock">
                        <span id="header-time" class="header-time">--:--:--</span>
                        <span id="header-date" class="header-date">---</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="notif-bell-wrapper" id="notif-bell-wrapper">
                        <button class="notif-bell-btn" onclick="handleBellClick()" onmouseenter="showNotifPreview()">
                            <i data-lucide="bell" class="icon-md notif-bell-icon"></i>
                            <span id="notif-badge" class="notif-badge hidden">0</span>
                        </button>
                    </div>
                    <div class="profile-header" onclick="openProfileModal()" style="cursor:pointer;">
                        <div class="profile-avatar"></div>
                        <div class="profile-info">
                            <span class="profile-name"></span>
                            <span class="profile-role"></span>
                        </div>
                    </div>
                </div>
            </header>

            <div id="content" class="page-content">
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Loading data...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="contact-fab" class="contact-fab">
        <div id="contact-menu" class="contact-menu hidden"></div>
        <button id="contact-fab-btn" class="contact-fab-btn" onclick="toggleContactMenu()">
            <i data-lucide="phone" class="icon-lg" id="contact-fab-icon"></i>
        </button>
    </div>

    <div id="profile-dp-container" class="profile-dp-container hidden"></div>

    <script src="app-core.js?v=20261008-1248"></script>
    <script src="app-api.js?v=20261008-1248"></script>
    <script src="app-ui.js"></script>
    <script src="app-views-partial.js"></script>
    <script src="app-views.js?v=20261009-quims-helpdesk-centered-logo"></script>
    <script src="app-loader.js"></script>
</body>

</html>
