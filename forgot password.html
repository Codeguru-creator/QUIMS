<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>QUIMS | Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="lucide.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        
         :root {
            --bg: #ffffff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
        }
        
        body.dark {
            --bg: #020617;
            --card: #020617;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* BACKGROUND NETWORK */
        
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        /* WRAPPER */
        
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }
        /* CARD */
        
        .card {
            background: linear-gradient(135deg, #064e3b, #0f766e, #a16207);
            padding: 2px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }
        
        .inner {
            background: var(--card);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        /* LOGO */
        
        .logo-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin: auto;
            border: 2px solid var(--border);
        }
        
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* TEXT */
        
        h2 {
            margin: 14px 0 8px;
            font-size: 22px;
            font-weight: 700;
        }
        
        .sub {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 22px;
            line-height: 1.6;
        }
        /* FORM */
        
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .input-wrap {
            position: relative;
        }
        
        .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }
        
        input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 13px;
        }
        
        input:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, .2);
        }
        /* BUTTON */
        
        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #064e3b, #0f766e);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        /* BACK LINK */
        
        .back-link {
            margin-top: 14px;
            font-size: 12px;
            color: #34d399;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
        }
        /* POPUP */
        
        #popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(360px, calc(100vw - 32px));
            padding: 10px 12px;
            border: 2px solid;
            border-left-width: 4px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.45;
            z-index: 99999;
            display: none;
            box-shadow: 0 8px 20px -6px rgba(15, 23, 42, .2);
            overflow-wrap: anywhere;
            background: #fff;
        }

        #popup.success {
            color: #047857;
            border-color: #059669;
        }

        #popup.error {
            color: #be123c;
            border-color: #dc2626;
        }
        /* LOADING */
        
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loader-box {
            text-align: center;
            color: #e5e7eb;
        }
        
        .loader-ring {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #0f766e;
            animation: spin .9s linear infinite;
            margin: auto;
        }
        
        .loader-text {
            margin-top: 12px;
            font-weight: 700;
        }
        
        .loader-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        /* MOBILE */
        
        @media(max-width:480px) {
            .wrapper {
                padding: 16px;
            }
            .inner {
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body class="dark">

    <!-- BACKGROUND -->
    <canvas id="bgCanvas"></canvas>

    <!-- POPUP -->
    <div id="popup"></div>

    <!-- LOADING -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="loader-ring"></div>
            <div class="loader-text">Sending reset link...</div>
            <div class="loader-sub">Please wait</div>
        </div>
    </div>

    <div class="wrapper">

        <div class="card">

            <div class="inner">

                <div class="logo-container">
                    <img src="system logo (2).webp" class="logo-img">
                </div>

                <h2>Forgot Password</h2>

                <p class="sub">
                    Enter your email address and we'll send you a secure password reset link.
                </p>

                <form id="forgotForm" method="POST" action="forgot_password.php">

                    <div class="input-wrap">

                        <i data-lucide="mail" class="icon"></i>

                        <input type="email" name="email" required placeholder="name@company.com" autocomplete="email">

                    </div>

                    <button type="submit">
          Send Reset Link
        </button>

                </form>

                <a href="index.html" class="back-link">
        ← Back to Login
      </a>

            </div>

        </div>

    </div>

    <script>
        lucide.createIcons();

        /* POPUP */
        function showPopup(msg, success = true) {

            const popup = document.getElementById("popup");

            popup.style.display = "block";
            popup.className = success ? "success" : "error";
            popup.innerText = msg;

            setTimeout(() => {
                popup.style.display = "none";
            }, 4000);

        }

        /* FORM */
        const form = document.getElementById("forgotForm");
        const loading = document.getElementById("loadingOverlay");

        form.addEventListener("submit", async(e) => {

            e.preventDefault();

            const submitButton = form.querySelector('button[type="submit"], button:not([type])');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            loading.style.display = "flex";
            if (submitButton) submitButton.disabled = true;

            try {

                const res = await fetch("forgot_password.php", {
                    method: "POST",
                    body: new FormData(form),
                    signal: controller.signal
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || "Unable to send a reset link.");
                }

                showPopup(
                    data.message || "If the email exists, a reset link has been sent.",
                    true
                );

                form.reset();

            } catch (err) {
                showPopup(
                    err.name === "AbortError"
                        ? "The mail server is taking too long to respond. Please try again shortly or contact the administrator."
                        : (err.message || "Server error. Try again."),
                    false
                );

            } finally {
                clearTimeout(timeoutId);
                loading.style.display = "none";
                if (submitButton) submitButton.disabled = false;
            }

        });

        /* NETWORK BACKGROUND */
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d");

        let particles = [];

        function init() {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles = [];

            for (let i = 0; i < 80; i++) {

                particles.push({

                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,

                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,

                    r: Math.random() * 2 + 1

                });

            }

        }

        function animate() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const color = document.body.classList.contains("dark") ?
                "45,212,191" :
                "15,118,110";

            particles.forEach(p => {

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) {
                    p.vx *= -1;
                }

                if (p.y < 0 || p.y > canvas.height) {
                    p.vy *= -1;
                }

                /* PARTICLES */
                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.r,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(${color},0.85)`;

                ctx.shadowColor = `rgba(${color},0.8)`;

                ctx.shadowBlur = 8;

                ctx.fill();

                /* NETWORKS */
                particles.forEach(o => {

                    const dx = p.x - o.x;
                    const dy = p.y - o.y;

                    const dist =
                        Math.sqrt(dx * dx + dy * dy);

                    if (dist < 140) {

                        ctx.beginPath();

                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(o.x, o.y);

                        ctx.strokeStyle =
                            `rgba(${color},${0.35 - dist / 500})`;

                        ctx.lineWidth = 0.8;

                        ctx.shadowColor =
                            `rgba(${color},0.5)`;

                        ctx.shadowBlur = 4;

                        ctx.stroke();

                    }

                });

            });

            requestAnimationFrame(animate);

        }

        window.addEventListener("resize", init);

        init();
        animate();
    </script>

</body>

</html>
